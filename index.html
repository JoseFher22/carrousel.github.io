<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrusel JoseFher Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            background: #000; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
        }

        .window {
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .track {
            display: flex;
            width: max-content;
            animation: scroll 20s linear infinite;
        }

        /* CONTENEDOR DE IMAGEN (Para el fondo de color) */
        .item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50vw; /* Dos imágenes por pantalla */
            height: 100vh;
            flex-shrink: 0;
        }

        /* 1. EL FONDO DINÁMICO: Crea un resplandor del color de la imagen */
        .item::before {
            content: "";
            position: absolute;
            width: 80%;
            height: 80%;
            background-image: var(--bg);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: blur(100px) opacity(0.5); /* Esto crea el color de fondo */
            z-index: -1;
        }

        /* 2. LA IMAGEN PRINCIPAL */
        .item img {
            height: 60vh;
            width: auto;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
        }

        /* 3. ZOOM AL PASAR EL RATÓN */
        .item img:hover {
            transform: scale(1.25);
            filter: drop-shadow(0 0 50px rgba(255,255,255,0.2));
        }

        /* 4. PAUSA TOTAL */
        .track:hover {
            animation-play-state: paused;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200vw); } /* Ajustado para el nuevo ancho */
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="track">
            <div class="item" style="--bg: url('1.gif')"><img src="1.gif"></div>
            <div class="item" style="--bg: url('image.png')"><img src="image.png"></div>
            <div class="item" style="--bg: url('1.gif')"><img src="1.gif"></div>
            <div class="item" style="--bg: url('image.png')"><img src="image.png"></div>
            <div class="item" style="--bg: url('1.gif')"><img src="1.gif"></div>
            <div class="item" style="--bg: url('image.png')"><img src="image.png"></div>
        </div>
    </div>

</body>
</html>
