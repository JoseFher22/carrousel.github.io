<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel JoseFher</title>
    <style>
        /* CONFIGURACIÓN BASE */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body { 
            /* Tu color azul #4e87ff con un degradado para que se vea pro */
            background: radial-gradient(circle, #4e87ff 0%, #2a5bbd 100%); 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            font-family: sans-serif;
        }

        .window {
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .track {
            display: flex;
            width: max-content;
            animation: scroll-infinito 20s linear infinite;
        }

        /* PAUSA AL PASAR EL RATÓN */
        .track:hover {
            animation-play-state: paused;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 60px; /* Espacio entre imágenes */
            flex-shrink: 0;
        }

        .item img {
            height: 60vh;
            width: auto;
            cursor: pointer;
            /* Suavidad para el zoom */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Sombra para que resalten sobre el azul */
            filter: drop-shadow(0 15px 35px rgba(0,0,0,0.2));
        }

        /* EFECTO DE AGRANDAR IMAGEN */
        .item img:hover {
            transform: scale(1.15);
            filter: drop-shadow(0 20px 45px rgba(0,0,0,0.3));
        }

        /* ANIMACIÓN */
        @keyframes scroll-infinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="track">
            <div class="item"><img src="1.gif"></div>
            <div class="item"><img src="image.png"></div>
            <div class="item"><img src="1.gif"></div>
            <div class="item"><img src="image.png"></div>
            <div class="item"><img src="1.gif"></div>
            <div class="item"><img src="image.png"></div>
        </div>
    </div>

</body>
</html>
